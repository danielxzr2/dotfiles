# ─── Opciones generales ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"   # true color para nvim
set -sg escape-time 0          # sin retraso al pulsar Esc en nvim
set -g focus-events on         # autoread de nvim
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on     # renumera ventanas al cerrar una
set -g status-interval 5
set -g display-time 2000
set-option -g set-clipboard on
set-option -g status-position top   # Status bar arriba

# ─── Keybinds ─────────────────────────────────────────────
set -g prefix C-s
unbind C-b
bind C-s send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf ✅"

# Moverse entre paneles (estilo vim)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Redimensionar paneles (repetible: prefix + H H H ...)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits y ventanas nuevas en el directorio actual
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Saltar a la ventana anterior / siguiente
bind -r C-p previous-window
bind -r C-n next-window

# ─── Copy mode (vi) ──────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# ─── Plugins (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix S guarda, prefix R restaura
set -g @plugin 'tmux-plugins/tmux-continuum'    # guardado automático cada 15 min
set -g @plugin 'christoomey/vim-tmux-navigator' # C-h/j/k/l entre nvim y tmux

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# ─── Catppuccin config ───────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status bar
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ─── Inicializar TPM (mantén SIEMPRE al final) ───────────
run '~/.tmux/plugins/tpm/tpm'
